apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: quietbuild-dev

resources:
  - ../../base

namePrefix: dev-

replicas:
  - name: robby
    count: 1
  - name: truthserum
    count: 1

labels:
  - pairs:
      environment: dev

commonAnnotations:
  - pairs:
      environment: "development"
      description: "Development environment - local K8s (Minikube/Docker Desktop)"

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: app-config
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DEVELOPMENT_MODE=true
