apiVersion: apps/v1
kind: Deployment
metadata:
  name: robby
  namespace: quietbuild
spec:
  template:
    spec:
      containers:
        - name: robby
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
