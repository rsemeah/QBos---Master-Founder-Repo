apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: quietbuild-production

resources:
  - ../../base
  - production-network-policy.yaml
  - production-pod-security-policy.yaml

namePrefix: prod-

replicas:
  - name: robby
    count: 3
  - name: truthserum
    count: 3

labels:
  - pairs:
      environment: production
      sla: critical

annotations:
  - pairs:
      environment: "production"
      description: "Production - Constitutional AI Infrastructure"
      sla: "99.95%"
      security: "hardened"
      constitutional-freeze: "true"

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: app-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - ENABLE_METRICS=true
      - ENABLE_TRACING=true
      - CONSTITUTIONAL_MODE=strict

secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
