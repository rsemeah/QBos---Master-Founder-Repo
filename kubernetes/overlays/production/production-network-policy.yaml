apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quietbuild-network-policy
  namespace: quietbuild
spec:
  podSelector:
    matchLabels:
      project: quietbuild
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
