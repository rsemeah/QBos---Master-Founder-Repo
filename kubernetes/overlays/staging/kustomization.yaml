apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

replicas:
  - name: robby
    count: 2
  - name: truthserum
    count: 2

commonLabels:
  environment: staging

commonAnnotations:
  environment: "staging"
  description: "Staging environment - pre-production verification"

images:
  - name: quietbuild/robby
    newName: ghcr.io/rsemeah/robby-pa
    newTag: latest
  - name: quietbuild/truthserum
    newName: nginx
    newTag: alpine

configMapGenerator:
  - name: app-config
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - STAGING_MODE=true
      - ENABLE_METRICS=true

secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
