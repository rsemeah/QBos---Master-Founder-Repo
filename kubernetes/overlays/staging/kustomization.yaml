apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: quietbuild-staging

resources:
  - ../../base

namePrefix: staging-

replicas:
  - name: robby
    count: 2
  - name: truthserum
    count: 2

labels:
  - pairs:
      environment: staging

annotations:
  - pairs:
      environment: "staging"
      description: "Staging environment - pre-production verification"
      sla: "99.5%"

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: app-config
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - STAGING_MODE=true
      - ENABLE_METRICS=true

secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
