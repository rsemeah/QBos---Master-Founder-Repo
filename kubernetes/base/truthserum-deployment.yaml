apiVersion: apps/v1
kind: Deployment
metadata:
  name: truthserum
  namespace: quietbuild
  labels:
    app: truthserum
    component: verification
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: truthserum
  template:
    metadata:
      labels:
        app: truthserum
        component: verification
    spec:
      containers:
        - name: truthserum
          image: quietbuild/truthserum:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: TRUTHSERUM_MODE
              value: "verify"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
