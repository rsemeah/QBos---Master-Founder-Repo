name: Robby PA CI

on:
  push:
    paths:
      - 'packages/robby-pa/**'
  pull_request:
    paths:
      - 'packages/robby-pa/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Run robby-pa tests
        working-directory: packages/robby-pa
        run: pnpm -w --filter @qbos/robby-pa test
