name: TruthGate CI — Constitutional Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  name: TruthGate CI — Constitutional Enforcement

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  jobs:
    truthgate:
      name: Constitutional Compliance Checks
      runs-on: ubuntu-latest
      timeout-minutes: 15
      env:
        RUN_CANONICAL_FLOW: 'false'
    
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
      
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
      
        - name: Install dependencies
          run: npm install --workspaces --if-present
        
        - name: Verify Route Manifest
          run: node scripts/verify-routes.js
        
        - name: Verify Engine Pages Exist
          run: node scripts/verify-engine-pages.js
        
        - name: Check for Dead-End Routes
          run: node scripts/check-dead-ends.js
        
        - name: Validate Receipt System
          run: node scripts/validate-receipts.js
        
        - name: TypeScript Type Check
          run: npx tsc --noEmit --project packages/engines/execution-engine/core/tsconfig.json
          continue-on-error: false
        
        - name: Run Canonical Flow Test
          if: env.RUN_CANONICAL_FLOW == 'true'
          run: bash test-canonical-flow.sh
          continue-on-error: false
          env:
            CI: true
          
        - name: Generate TruthGate Report
          if: always()
          run: node scripts/truthgate-report.js
        
        - name: Upload TruthGate Artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: truthgate-report
            path: |
              truthgate-report.json
              truthgate-report.md
            retention-days: 30
