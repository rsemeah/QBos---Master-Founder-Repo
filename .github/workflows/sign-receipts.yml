name: Sign and publish Robby receipts

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Commit message for signed receipts'
        required: false
        default: 'ci: add signed receipts'

permissions:
  contents: write

jobs:
  sign-and-publish:
    name: Sign and publish receipts (manual, maintainer-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sign pending receipts
        env:
          RECEIPT_SIGNING_KEY: ${{ secrets.RECEIPT_SIGNING_KEY }}
        run: |
          set -e
          mkdir -p .robby/receipts
          if [ -d .robby/pending ]; then
            for f in .robby/pending/*.json; do
              [ -f "$f" ] || continue
              node ./scripts/sign-receipt.js "$f" ".robby/receipts/$(basename "$f")"
            done
          else
            echo 'No .robby/pending directory — nothing to sign.'
          fi

      - name: Commit and push signed receipts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .robby/receipts || true
          if git diff --staged --quiet; then
            echo 'No receipts to commit.'
          else
            git commit -m "${{ github.event.inputs.message }}"
            git push
          fi
