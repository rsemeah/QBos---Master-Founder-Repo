name: Verify Claims

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  verify:
    name: Block False Claims
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Run Claim Verification
        run: tsx scripts/verify-claims.ts

      - name: Comment PR with results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Claim Verification Failed

            This PR contains inflated claims that don't match reality.

            **Common Issues:**
            - TODOs in files marked "complete"
            - In-memory storage (Map<>) in production engines
            - Fake test scripts (\`echo "Tests coming soon"\`)
            - README claiming "production ready" without proof

            **Next Steps:**
            1. Review the failed checks in the logs above
            2. Read \`docs/VERIFICATION_FRAMEWORK.md\`
            3. Fix the issues
            4. Push changes to re-run verification

            **Remember:** We're building trust by being honest about what works.
            `
            })
