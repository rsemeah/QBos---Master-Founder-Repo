name: CI (slim - truthserum + robby-pa)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  verify-slim:
    name: Verify (TruthSerum + Robby PA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TruthSerum
        run: npx tsc -p packages/truthserum/tsconfig.json --noEmit

      - name: Test TruthSerum
        run: pnpm --filter @qbos/truthserum test

      - name: Test Robby PA
        run: pnpm --filter @qbos/robby-pa test

      - name: Optional - Run robby verify if secrets set
        if: ${{ secrets.ROBBY_RECEIPT_MAC_SECRET != '' }}
        run: pnpm run robby:verify
        env:
          ROBBY_RECEIPT_MAC_SECRET: ${{ secrets.ROBBY_RECEIPT_MAC_SECRET }}

      - name: Upload receipts artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: robby-receipts
          path: |
            packages/robby-pa/receipts/**
            receipts/**
