name: RedLantern CI (Reusable)
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      run-e2e:
        required: false
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test --if-present
      - name: Build
        run: pnpm build
      - name: E2E tests
        if: ${{ inputs.run-e2e }}
        run: pnpm test:e2e --if-present
